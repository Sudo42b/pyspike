[build-system]
requires = [
  "auditwheel",
  "build",
  "packaging>=25",
  "patchelf",
  "pip>=23",
  "pybind11[global]>3",
  "setuptools>=75",
  "setuptools_scm[toml]>=9",
  "wheel"
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel.linux]
before-all = "yum install -y dtc && git submodule update --init --recursive"

[project]
name = "spike"
dynamic = ["version"]
authors = [
    {name = "LIU Yu", email = "liuyu@huimtlab.org"},
]
license = {file = "LICENSE"}
description = "Python Bindings of Spike RISC-V ISA Simulator"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["RISC-V", "spike", "ISA", "simulator", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Framework :: cocotb",
  "Framework :: Pytest",
  "Framework :: Sphinx",
  "Framework :: tox",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed"
]
requires-python = ">=3.10"

dependencies = [
  "numpy",
]

[project.urls]
Homepage = "https://github.com/liuyu81/pyspike"

[project.optional-dependencies]
dev = [
  "auditwheel",
  "build",
  "packaging>=25",
  "patchelf",
  "pexpect",
  "pip>=23",
  "pybind11[global]",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mypy",
  "pytest-pylint",
  "pytest-repeat",
  "pytest-timeout",
  "setuptools>=75",
  "setuptools_scm[toml]>=9",
  "twine",
  "wheel"
]

[project.scripts]
pyspike-verify = "riscv.gtx._verify:main"

[tool.setuptools]
script-files = [
  "scripts/spike",
  "scripts/pyspike"
]

[tool.setuptools.packages.find]
where = [
  "src/main/python"
]
include = [
  "riscv",
  "riscv.*"
]

[tool.setuptools.package-data]
riscv = [
  "data/bin/spike",
  "data/include/**/*.h",
  "data/lib/libdisasm.a",
  "data/lib/libfesvr.a",
  "data/lib/libriscv.so",
  "data/lib/pkgconfig/*.pc"
]
# "riscv.gtx" = [
#   "data/firmware/*.elf",
#   "data/golden/*.hex"
# ]

[tool.pytest.ini_options]
addopts = "--pylint --mypy --cov-report=lcov"
# log_cli = true
# log_level = "DEBUG"
filterwarnings = [
  "ignore::UserWarning"
]
pythonpath = [
  "src/main/python",
  "examples"
]
testpaths = [
  "tests"
]
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
mypy_path = [
  "src/main/python"
]
namespace_packages = 1
explicit_package_bases = 1
ignore_missing_imports = 1
check_untyped_defs = 1

[tool.pylint.'BASIC']
ignore-patterns = [
  "_version.py"
]

good-names = [
  "ex",
  "pc",
  "ch"
]

# [tool.pylint.'MESSAGES CONTROL']
# disable = [
#   "missing-docstring",
#   "too-few-public-methods",
#   "too-many-instance-attributes",
#   "too-many-return-statements",
#   "consider-using-get"
# ]

# [tool.pylint.FORMAT]
# max-line-length = 120

# [tool.pylint.SIMILARITIES]
# ignore-comments = "yes"
# ignore-docstrings = "yes"
# ignore-imports = "yes"

[tool.coverage.run]
source = [
  "examples",
  "src/main/python",
  "tests"
]

[tool.coverage.lcov]
output = "riscv.lcov"

[tool.coverage.report]
exclude_lines = [
    # Don't complain about namespace package __init__.py
    "__path__ = __import__(pkgutil).extend_path(__path__, __name__)",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == __main__:",
    # Don't complain about abstract methods, they aren't run:
    "@abc.abstractmethod",
    # Don't complain about nop
    "pass"
]
